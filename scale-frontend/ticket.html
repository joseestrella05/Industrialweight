<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Ticket de Pesaje</title>
  <style>
    @page { 
      margin: 0; 
      size: 80mm auto; 
    }
    * { box-sizing: border-box; }
    body {
      font-family: 'Courier New', Courier, monospace;
      width: 72mm;
      margin: 0 auto;
      padding: 12px 2px;
      color: #000;
      background: #fff;
      font-size: 13px;
      line-height: 1.25;
    }
    .center { text-align: center; }
    .bold { font-weight: bold; }
    .divider { 
      border-bottom: 1px dashed #000; 
      margin: 8px 0; 
    }
    .row { 
      display: flex; 
      justify-content: space-between; 
      margin: 4px 0; 
    }
    .total-box { 
      font-size: 16px; 
      font-weight: 900; 
      margin: 6px 0; 
      text-align: center;
      background-color: #000;
      color: #fff;
      padding: 4px 0;
    }
    .signatures { 
      margin-top: 35px; 
      display: flex; 
      justify-content: space-between; 
      font-size: 10px; 
      text-align: center;
    }
    .footer {
      margin-top: 20px;
      font-size: 10px;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="center bold" style="font-size: 15px;">TERMINAL DE PESAJE</div>
  <div class="center" style="font-size: 11px;">CONTROL BÁSCULA INDUSTRIAL</div>
  <div class="divider"></div>

  <div class="row"><span>BOLETA:</span><span id="t-id" class="bold">#00000</span></div>
  <div class="row"><span>ESTADO:</span><span id="t-estado">--</span></div>
  <div class="row"><span>PLACA:</span><span id="t-placa" class="bold">--</span></div>
  <div class="row"><span>CHOFER:</span><span id="t-chofer">--</span></div>
  <div class="row"><span>PRODUCTO:</span><span id="t-producto">--</span></div>
  <div class="divider"></div>

  <div class="center bold">══ ENTRADA ══</div>
  <div class="row"><span>Fecha:</span><span id="t-fecha-entrada">--</span></div>
  <div class="row"><span>Peso:</span><span id="t-peso-entrada">0.00 kg</span></div>
  <div class="divider"></div>

  <div class="center bold">══ SALIDA ══</div>
  <div class="row"><span>Fecha:</span><span id="t-fecha-salida">--</span></div>
  <div class="row"><span>Peso:</span><span id="t-peso-salida">0.00 kg</span></div>
  <div class="divider"></div>

  <div class="total-box">
    ██ PESO NETO: <span id="t-neto">0.00</span> <span id="t-unidad">kg</span> ██
  </div>
  <div class="divider"></div>

  <div class="signatures">
    <div>
      ________<br>
      Operador
    </div>
    <div>
      ________<br>
      Conductor
    </div>
  </div>

  <div class="footer">
    *** COMPROBANTE NO EDITABLE ***
  </div>

  <script>
    const { ipcRenderer } = require('electron');

    try {
      const data = ipcRenderer.sendSync('obtener-datos-ticket');

      if (data) {
        document.getElementById('t-id').textContent = '#' + String(data.id || 0).padStart(5, '0');
        document.getElementById('t-estado').textContent = data.estado || 'COMPLETADO';
        document.getElementById('t-placa').textContent = String(data.placa || 'S/P').toUpperCase();
        document.getElementById('t-chofer').textContent = data.chofer || 'GENÉRICO';
        document.getElementById('t-producto').textContent = data.producto || 'VARIOS';

        document.getElementById('t-fecha-entrada').textContent = data.fecha_entrada || '--';
        document.getElementById('t-fecha-salida').textContent = data.fecha_salida || '--';

        const pesoEntrada = Number(data.peso_entrada || 0).toFixed(2);
        const pesoSalida = Number(data.peso_salida || 0).toFixed(2);
        const neto = Number(data.peso_neto || 0).toFixed(2);
        const unidad = data.unidad || 'kg';

        document.getElementById('t-peso-entrada').textContent = `${pesoEntrada} ${unidad}`;
        document.getElementById('t-peso-salida').textContent = `${pesoSalida} ${unidad}`;
        document.getElementById('t-neto').textContent = neto;
        document.getElementById('t-unidad').textContent = unidad;

        setTimeout(() => {
          window.print();
        }, 300);
      }
    } catch (err) {
      console.error('Error renderizando ticket:', err);
    }
  </script>
</body>
</html>
