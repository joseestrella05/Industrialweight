<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <title>Sistema de Pesaje Industrial</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0f1115;
      color: #e0e0e0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      height: 100vh;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #232730;
      padding-bottom: 12px;
    }

    .header h1 {
      font-size: 1.1rem;
      text-transform: uppercase;
      color: #8a99ad;
      letter-spacing: 1px;
    }

    .indicator-box {
      background: #050608;
      border: 2px solid #1f242d;
      border-radius: 10px;
      padding: 25px;
      text-align: center;
    }

    .weight-value {
      font-family: 'Courier New', Courier, monospace;
      font-size: 4.5rem;
      font-weight: 900;
      letter-spacing: 4px;
      color: #00ff66;
      text-shadow: 0 0 15px rgba(0, 255, 102, 0.4);
    }

    .unit {
      font-size: 1.8rem;
      color: #5a6e85;
      margin-left: 8px;
    }

    .status-badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 0.75rem;
      font-weight: bold;
      text-transform: uppercase;
      margin-top: 10px;
    }

    .stable {
      background: rgba(0, 255, 102, 0.15);
      color: #00ff66;
      border: 1px solid #00ff66;
    }

    .unstable {
      background: rgba(255, 170, 0, 0.15);
      color: #ffaa00;
      border: 1px solid #ffaa00;
    }

    /* Formulario de Registro */
    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      background: #15181e;
      padding: 16px;
      border-radius: 8px;
      border: 1px solid #232730;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    label {
      font-size: 0.8rem;
      color: #8a99ad;
      text-transform: uppercase;
    }

    input {
      background: #0d0f12;
      border: 1px solid #2a313d;
      border-radius: 6px;
      padding: 10px;
      color: #fff;
      font-size: 0.95rem;
    }

    input:focus {
      border-color: #0066ff;
      outline: none;
    }

    .btn-primary {
      padding: 16px;
      background: #0066ff;
      border: none;
      border-radius: 8px;
      color: #fff;
      font-size: 1.05rem;
      font-weight: bold;
      cursor: pointer;
    }

    .btn-primary:disabled {
      background: #1c2536;
      color: #52617a;
      cursor: not-allowed;
    }
  </style>
</head>

<body>

  <div class="header">
    <h1>Terminal de Pesaje // XK3190-A12E</h1>
    <span id="conn-status" style="font-size: 0.85rem; color: #ff4444;">● Desconectado</span>
  </div>

  <div class="indicator-box">
    <div>
      <span id="display-weight" class="weight-value">0.00</span>
      <span id="display-unit" class="unit">kg</span>
    </div>
    <div id="display-status" class="status-badge unstable">Inestable</div>
  </div>

  <div class="form-grid">
    <div class="field">
      <label>Placa / Ficha del Camión</label>
      <input type="text" id="placa" placeholder="Ej: L245012">
    </div>
    <div class="field">
      <label>Chofer</label>
      <input type="text" id="chofer" placeholder="Nombre completo">
    </div>
    <div class="field">
      <label>Producto</label>
      <input type="text" id="producto" placeholder="Ej: Cacao Fermentado / Maíz">
    </div>
    <div class="field">
      <label>Tara (kg)</label>
      <input type="number" id="tara" value="0.00" step="0.01">
    </div>
  </div>

  <button id="btn-save" class="btn-primary" disabled onclick="guardarPesaje()">Registrar Pesaje</button>

  <div style="margin-top: 15px;">
    <h3 style="font-size: 0.9rem; color: #8a99ad; margin-bottom: 8px; text-transform: uppercase;">Últimos Pesajes
      Registrados</h3>
    <table
      style="width: 100%; border-collapse: collapse; background: #15181e; border-radius: 8px; overflow: hidden; font-size: 0.85rem;">
      <thead>
        <tr style="background: #1f242d; color: #8a99ad; text-align: left;">
          <th style="padding: 8px;"># Boleta</th>
          <th style="padding: 8px;">Fecha / Hora</th>
          <th style="padding: 8px;">Placa</th>
          <th style="padding: 8px;">Producto</th>
          <th style="padding: 8px;">Bruto</th>
          <th style="padding: 8px;">Tara</th>
          <th style="padding: 8px;">Neto</th>
        </tr>
      </thead>
      <tbody id="tickets-table-body">
        <!-- Rellenado dinámicamente -->
      </tbody>
    </table>
  </div>

  <script>
    let currentWeight = 0;
    let currentUnit = 'kg';
    let isStable = false;

    const weightEl = document.getElementById('display-weight');
    const unitEl = document.getElementById('display-unit');
    const statusEl = document.getElementById('display-status');
    const connEl = document.getElementById('conn-status');
    const saveBtn = document.getElementById('btn-save');

    function connect() {
      const socket = new WebSocket('ws://127.0.0.1:8080/ws');

      socket.onopen = () => {
        connEl.textContent = '● En línea';
        connEl.style.color = '#00ff66';
      };

      socket.onmessage = (event) => {
        const data = JSON.parse(event.data);
        currentWeight = data.value;
        currentUnit = data.unit;
        isStable = data.is_stable;

        weightEl.textContent = currentWeight.toFixed(2);
        unitEl.textContent = currentUnit;

        if (isStable) {
          statusEl.textContent = 'Estable';
          statusEl.className = 'status-badge stable';
          saveBtn.disabled = false;
        } else {
          statusEl.textContent = 'En Movimiento';
          statusEl.className = 'status-badge unstable';
          saveBtn.disabled = true;
        }
      };

      socket.onclose = () => {
        connEl.textContent = '● Reconectando...';
        connEl.style.color = '#ffaa00';
        setTimeout(connect, 1500);
      };
    }

    async function guardarPesaje() {
      const payload = {
        placa: document.getElementById('placa').value || "S/P",
        chofer: document.getElementById('chofer').value || "Genérico",
        producto: document.getElementById('producto').value || "Varios",
        peso_bruto: currentWeight,
        tara: parseFloat(document.getElementById('tara').value) || 0,
        unidad: currentUnit
      };

      try {
        const response = await fetch('http://127.0.0.1:8080/api/ticket', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const result = await response.json();
        if (result.success) {
          // 1. Refrescar la tabla inmediatamente
          await cargarHistorial();

          // 2. Limpiar campos del formulario
          document.getElementById('placa').value = '';
          document.getElementById('chofer').value = '';
          document.getElementById('producto').value = '';
          document.getElementById('tara').value = '0.00';

          alert(`Boleta #${result.id} registrada con éxito.\nPeso Neto: ${result.peso_neto.toFixed(2)} ${currentUnit}`);
        }
      } catch (err) {
        alert('Error registrando boleta: ' + err.message);
      }
    }

    async function cargarHistorial() {
      try {
        const res = await fetch('http://127.0.0.1:8080/api/tickets');
        const tickets = await res.json();

        if (!tickets || !Array.isArray(tickets)) return;

        const tbody = document.getElementById('tickets-table-body');
        tbody.innerHTML = tickets.map(t => `
      <tr style="border-bottom: 1px solid #232730;">
        <td style="padding: 10px; font-weight: bold; color: #00ff66;">#${String(t.id).padStart(5, '0')}</td>
        <td style="padding: 10px; color: #8a99ad;">${t.fecha}</td>
        <td style="padding: 10px; font-weight: bold;">${t.placa}</td>
        <td style="padding: 10px;">${t.producto}</td>
        <td style="padding: 10px;">${t.peso_bruto.toFixed(2)} ${t.unidad}</td>
        <td style="padding: 10px;">${t.tara.toFixed(2)} ${t.unidad}</td>
        <td style="padding: 10px; font-weight: bold; color: #fff;">${t.peso_neto.toFixed(2)} ${t.unidad}</td>
      </tr>
    `).join('');
      } catch (e) {
        console.error('Error cargando historial:', e);
      }
    }
    cargarHistorial();

    connect();
  </script>
</body>

</html>
